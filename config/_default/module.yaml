imports:
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-decap-cms
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-netlify
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

# Mount: exponemos assets/media/ bajo /media/ para que las
# referencias <img src="/media/xxx"> de los bloques markdown funcionen
# sin colisionar con páginas de contenido (p. ej. /donatello/).
mounts:
  - source: assets/media
    target: static/media
